server {
    listen 80;
    listen [::]:80;
    server_name primeclinicptk.com www.primeclinicptk.com 179.197.254.116;

    client_max_body_size 20M;

    # React Frontend Build
    location / {
        root /var/www/primeclinic/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Django API
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/primeclinic/backend/gunicorn.sock;
    }

    # Django Admin
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/primeclinic/backend/gunicorn.sock;
    }

    # Django Static Files
    location /django_static/ {
        alias /var/www/primeclinic/backend/staticfiles/;
    }

    # Django Media Files (Excel uploads/reports)
    location /media/ {
        alias /var/www/primeclinic/backend/media/;
    }
}